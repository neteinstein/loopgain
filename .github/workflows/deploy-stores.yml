name: Deploy to Stores

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - playstore-promote
          - appstore
          - both
      play_from_track:
        description: 'Play Store: promote FROM this track (playstore-promote/both only)'
        required: false
        default: 'internal'
      play_to_track:
        description: 'Play Store: promote TO this track (playstore-promote/both only)'
        required: false
        default: 'production'
      ios_version:
        description: 'App Store: marketing version to archive (appstore/both only)'
        required: false
        default: '1.0.0'

jobs:
  # release.yml already auto-publishes every release build to the Play Console's "internal"
  # track (gated on the ANDROID_PUBLISHER_CREDENTIALS secret). This job does not rebuild or
  # re-upload anything - it promotes the artifact already sitting on play_from_track to
  # play_to_track (e.g. internal -> production) via the Gradle Play Publisher plugin
  # (androidApp/build.gradle.kts), which is how a release actually reaches production.
  promote-playstore:
    if: github.event.inputs.target == 'playstore-promote' || github.event.inputs.target == 'both'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Play publisher credentials
      env:
        ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
      run: |
        if [ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
          echo "::error::ANDROID_PUBLISHER_CREDENTIALS secret not set. See CI_CD.md for setup."
          exit 1
        fi

    - name: Promote Play Store release
      env:
        ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
      run: |
        ./gradlew promoteReleaseArtifact \
          --from-track "${{ github.event.inputs.play_from_track }}" \
          --promote-track "${{ github.event.inputs.play_to_track }}" \
          --no-daemon --stacktrace

  # Requires real Apple Distribution signing (a certificate + provisioning profile), which this
  # repo does not have configured yet - iosApp/iosApp.xcodeproj is a new, unsigned scaffold (see
  # CI_CD.md and release.yml's release-ios job, which builds it unsigned on every release for
  # verification only). This job fails fast with a clear message until BUILD_CERTIFICATE_BASE64,
  # P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64 and KEYCHAIN_PASSWORD are added as secrets.
  deploy-ios:
    if: github.event.inputs.target == 'appstore' || github.event.inputs.target == 'both'
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate required secrets
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        missing=()
        [ -z "$BUILD_CERTIFICATE_BASE64" ] && missing+=("BUILD_CERTIFICATE_BASE64")
        [ -z "$P12_PASSWORD" ] && missing+=("P12_PASSWORD")
        [ -z "$BUILD_PROVISION_PROFILE_BASE64" ] && missing+=("BUILD_PROVISION_PROFILE_BASE64")
        [ -z "$KEYCHAIN_PASSWORD" ] && missing+=("KEYCHAIN_PASSWORD")
        [ -z "$EXPORT_OPTIONS_PLIST" ] && missing+=("EXPORT_OPTIONS_PLIST")
        [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] && missing+=("APP_STORE_CONNECT_API_KEY_ID")
        [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
        [ -z "$APP_STORE_CONNECT_API_KEY" ] && missing+=("APP_STORE_CONNECT_API_KEY")
        if [ ${#missing[@]} -ne 0 ]; then
          echo "::error::Missing required Action secrets for App Store deployment: ${missing[*]}. LoopGain's iOS project (iosApp/iosApp.xcodeproj) has no signing identity configured yet - see 'Apple signing setup' in CI_CD.md before running this."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Standard Apple CI signing dance: import the distribution cert + provisioning profile into
    # a throwaway keychain for this run only, since xcodebuild reads signing material from the
    # keychain and Xcode's provisioning profile store, not from a file path.
    - name: Import signing certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
        security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Archive iOS app
      env:
        APP_VERSION_NAME: ${{ github.event.inputs.ios_version }}
      run: |
        xcodebuild archive \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
          MARKETING_VERSION="$APP_VERSION_NAME"

    - name: Export IPA
      env:
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
        echo "$EXPORT_OPTIONS_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export"

    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
        echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$API_KEY_PATH"
        mkdir -p ~/.appstoreconnect/private_keys
        cp "$API_KEY_PATH" ~/.appstoreconnect/private_keys/

        xcrun altool --upload-app --type ios \
          --file "$RUNNER_TEMP/export"/*.ipa \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

    - name: Clean up keychain and provisioning profile
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
        rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
