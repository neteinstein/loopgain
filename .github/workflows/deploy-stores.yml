name: Deploy to Stores

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - playstore
          - appstore
          - both

jobs:
  deploy-android:
    if: github.event.inputs.target == 'playstore' || github.event.inputs.target == 'both'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 -d > keystore.jks
        
    - name: Build release bundle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease --no-daemon
      
    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        packageName: org.neteinstein.loopgain
        releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
        track: production
        status: completed

  deploy-ios:
    if: github.event.inputs.target == 'appstore' || github.event.inputs.target == 'both'
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install CocoaPods
      run: |
        cd iosApp
        pod install
        
    - name: Build iOS app
      run: |
        cd iosApp
        xcodebuild -workspace iosApp.xcworkspace \
          -scheme iosApp \
          -configuration Release \
          -archivePath $PWD/build/iosApp.xcarchive \
          archive
          
    - name: Export IPA
      env:
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
        cd iosApp
        echo $EXPORT_OPTIONS_PLIST | base64 -d > ExportOptions.plist
        xcodebuild -exportArchive \
          -archivePath $PWD/build/iosApp.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $PWD/build
          
    - name: Upload to App Store
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        cd iosApp/build
        xcrun altool --upload-app --type ios \
          --file *.ipa \
          --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
