name: PR Checks

on:
  pull_request:
    # Trigger on pull requests to any branch

# Cancel in-progress runs on new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Limit permissions to read-only by default
permissions:
  contents: read

jobs:
  # Linting job - runs independently
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci androidApp/google-services.json

    - name: Run linting
      run: ./gradlew lint --no-daemon
      
    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          **/build/reports/lint-results*.html
          **/build/reports/lint-results*.xml

  # Unit tests job - runs in parallel with other jobs
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci androidApp/google-services.json

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          **/build/reports/tests/testDebugUnitTest/
          **/build/test-results/testDebugUnitTest/

  # UI/Instrumented tests job - runs in parallel with other jobs
  ui-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci androidApp/google-services.json

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: ./gradlew connectedDebugAndroidTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-reports
        path: |
          **/build/reports/androidTests/connected/
          **/build/outputs/androidTest-results/

  # iOS build check - runs in parallel with other jobs
  # Builds for the simulator SDK only, so no signing identity is needed at all. Not yet in
  # pr-validation-summary's `needs`: iosApp/iosApp.xcodeproj is a new, hand-authored scaffold
  # with no track record in CI, so this reports status without blocking merges until it's
  # proven green. Promote it to a required check once it has run clean for a while.
  ios-build:
    runs-on: macos-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Find an available iOS simulator
      id: simulator
      run: |
        UDID=$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        data = json.load(sys.stdin)["devices"]
        for runtime, devices in data.items():
            if "iOS" not in runtime:
                continue
            for d in devices:
                if d["isAvailable"] and d["name"].startswith("iPhone"):
                    print(d["udid"])
                    sys.exit(0)
        sys.exit(1)
        ')
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build iOS app for simulator
      run: |
        xcodebuild build \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGN_STYLE=Manual \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Diagnose generated ComposeApp.framework header
      if: always()
      run: |
        echo "--- ComposeApp.framework locations ---"
        find . ~/Library/Developer/Xcode/DerivedData -iname "ComposeApp.framework" -type d 2>/dev/null
        echo "--- header contents (initKoin / AppModuleKt) ---"
        find . ~/Library/Developer/Xcode/DerivedData -iname "ComposeApp.h" 2>/dev/null | while read -r h; do
          echo "== $h =="
          grep -n "initKoin\|AppModuleKt" "$h" || echo "(no match)"
        done

  # Summary job - requires all jobs to pass
  # This enforces that if any job fails, the PR check fails
  pr-validation-summary:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, ui-tests]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "UI Tests: ${{ needs.ui-tests.result }}"
        
        if [[ "${{ needs.lint.result }}" != "success" ]] || \
           [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
           [[ "${{ needs.ui-tests.result }}" != "success" ]]; then
          echo "One or more validation jobs failed"
          exit 1
        fi
        
        echo "All validation jobs passed successfully"
