name: PR Checks

on:
  pull_request:
    # Trigger on pull requests to any branch

# Cancel in-progress runs on new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Limit permissions to read-only by default
permissions:
  contents: read

jobs:
  # Linting job - runs independently
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci composeApp/google-services.json

    - name: Run linting
      run: ./gradlew lint --no-daemon
      
    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          **/build/reports/lint-results*.html
          **/build/reports/lint-results*.xml

  # Unit tests job - runs in parallel with other jobs
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci composeApp/google-services.json

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          **/build/reports/tests/testDebugUnitTest/
          **/build/test-results/testDebugUnitTest/

  # UI/Instrumented tests job - runs in parallel with other jobs
  ui-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create placeholder google-services.json for CI
      run: cp .github/ci/google-services.json.ci composeApp/google-services.json

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: ./gradlew connectedDebugAndroidTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-reports
        path: |
          **/build/reports/androidTests/connected/
          **/build/outputs/androidTest-results/

  # Summary job - requires all jobs to pass
  # This enforces that if any job fails, the PR check fails
  pr-validation-summary:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, ui-tests]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "UI Tests: ${{ needs.ui-tests.result }}"
        
        if [[ "${{ needs.lint.result }}" != "success" ]] || \
           [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
           [[ "${{ needs.ui-tests.result }}" != "success" ]]; then
          echo "One or more validation jobs failed"
          exit 1
        fi
        
        echo "All validation jobs passed successfully"
