name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Default permissions for validation jobs
permissions:
  contents: read

jobs:
  # Linting job - runs independently
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run linting
      run: ./gradlew lint --no-daemon
      
    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          **/build/reports/lint-results*.html
          **/build/reports/lint-results*.xml

  # Unit tests job - runs in parallel with other jobs
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          **/build/reports/tests/testDebugUnitTest/
          **/build/test-results/testDebugUnitTest/

  # UI/Instrumented tests job - runs in parallel with other jobs
  ui-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: ./gradlew connectedDebugAndroidTest --no-daemon
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-reports
        path: |
          **/build/reports/androidTests/connected/
          **/build/outputs/androidTest-results/

  # Snapshot tests job - runs in parallel with other jobs
  # Note: Currently configured with continue-on-error as Paparazzi may not be fully set up
  snapshot-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run snapshot tests
      run: ./gradlew verifyPaparazziDebug --no-daemon
      continue-on-error: true
      
    - name: Upload snapshot test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-test-reports
        path: |
          **/build/reports/paparazzi/
          **/out/failures/
        if-no-files-found: ignore

  # Build and release job - only runs after all validations pass
  build-and-release:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, ui-tests, snapshot-tests]
    # Grant write permissions for creating releases
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon
      
    - name: Get version
      id: version
      run: |
        echo "VERSION=$(grep 'versionName' composeApp/build.gradle.kts | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT
        echo "BUILD=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.BUILD }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        
    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
        asset_name: loopgain-${{ steps.version.outputs.VERSION }}.apk
        asset_content_type: application/vnd.android.package-archive
